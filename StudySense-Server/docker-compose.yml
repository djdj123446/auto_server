services:
  mysql:
    image: mysql:8.0
    container_name: studysense-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: studysense
      MYSQL_USER: studysense
      MYSQL_PASSWORD: studysense123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.8.3
    container_name: studysense-emqx
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "1883:1883"     # MQTT TCP (ESP32 连这个)
      - "8083:8083"     # MQTT over WebSocket
      - "18083:18083"   # EMQX 管理界面 http://localhost:18083
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  mysql_data:
  emqx_data:
  emqx_log:
